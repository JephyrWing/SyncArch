name: SyncArch CI and Cloudtype CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  PYTHONUNBUFFERED: "1"
  TEST_MARIADB_BIN: /usr/bin

jobs:
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
      - name: Verify release gate rejection cases
        run: python -m unittest discover -s .github/scripts -p test_ci.py -v
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: Frontend unit tests (zero skips)
        working-directory: frontend
        run: |
          mkdir -p ../.local
          node --test --test-reporter=junit --test-reporter-destination=../.local/frontend.xml src/utils/*.test.ts
          python ../.github/scripts/check_junit.py ../.local/frontend.xml
      - run: npm run build
        working-directory: frontend
      - run: python .github/scripts/frontend_artifact.py create "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: |
            frontend/dist
            .local/frontend-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Authenticate disposable Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET requirepass ci-only-redis; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python .github/scripts/run_backend.py unit
      - name: Retain required test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ github.sha }}
          path: .local/unit.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  mariadb-integration:
    name: mariadb-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      cloudtype-mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
        ports: ["3307:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Authenticate disposable Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET requirepass ci-only-redis; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: MariaDB 11.4 integration, migrations and restart
        env:
          MARIA_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          python .github/scripts/run_backend.py mariadb --restart-service "$MARIA_CONTAINER"
          cp .local/mariadb.xml .local/mariadb-11.4.xml
          cp .local/database-version.json .local/database-11.4.json
      - name: Cloudtype MariaDB 11.2 compatibility, migrations and restart
        env:
          CI_DB_PORT: "3307"
          MARIA_CONTAINER: ${{ job.services.cloudtype-mariadb.id }}
        run: |
          python .github/scripts/run_backend.py mariadb --restart-service "$MARIA_CONTAINER"
          cp .local/mariadb.xml .local/mariadb-11.2.xml
          cp .local/database-version.json .local/database-11.2.json
      - name: Retain database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mariadb-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/*.xml
            .local/database*.json
          if-no-files-found: warn
          retention-days: 7

  playwright-e2e:
    name: playwright-e2e
    needs: frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TEST_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: .
      - run: python .github/scripts/frontend_artifact.py verify "${{ github.sha }}"
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chrome
      - run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      - name: Authenticate disposable Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET requirepass ci-only-redis; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build exact release containers
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --build-arg "RELEASE_SHA=$SOURCE_SHA" -f deploy/backend/Dockerfile -t "syncarch-backend:$SOURCE_SHA" .
          docker build --build-arg "RELEASE_SHA=$SOURCE_SHA" -f deploy/frontend/Dockerfile -t "syncarch-frontend:$SOURCE_SHA" .
      - name: Real Nginx and single process Waitress read/save smoke
        run: python .github/scripts/container_smoke.py
      - name: Real product browser, API concurrency and dump restore
        run: python .github/scripts/run_backend.py browser
      - name: Ensure browser tests did not change the release build
        run: python .github/scripts/frontend_artifact.py verify "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.sha }}
          path: |
            .local/release-images.tar
            .local/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/browser.xml
            .local/*.png
            .local/w11-*.json
            .local/database-version.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: cloudtype-production
    needs: [frontend-checks, pytest, mariadb-integration, playwright-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: cloudtype-production
      cancel-in-progress: false
    environment:
      name: cloudtype-production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
      SMOKE_LOGIN_ID: ${{ secrets.SMOKE_LOGIN_ID }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
      - name: Require deploy configuration and current main SHA
        run: python .github/scripts/deploy.py preflight
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images-${{ github.sha }}
          path: .local
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and deploy immutable digests
        run: python .github/scripts/deploy.py
      - name: Public HTTPS read/save and exact revision smoke
        run: python .github/scripts/smoke.py
      - name: Retain release and recovery identifiers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/release-manifest.json
            .local/published-images.json
            .local/cloudtype-release.json
          if-no-files-found: warn
          retention-days: 30

