name: Extended regression (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PYTHONUNBUFFERED: "1"
  TEST_MARIADB_BIN: /usr/bin

jobs:
  database-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ["11.2", "11.4.13"]
    services:
      mariadb:
        image: mariadb:${{ matrix.database }}
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Authenticate disposable Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET requirepass ci-only-redis; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Full backend suite, migrations and restart
        env:
          MARIA_CONTAINER: ${{ job.services.mariadb.id }}
        run: python .github/scripts/run_backend.py mariadb-full --restart-service "$MARIA_CONTAINER"
      - name: Retain database reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-database-${{ matrix.database }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/mariadb-full.xml
            .local/database-version.json
          retention-days: 7

  full-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.6
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python .github/scripts/frontend_artifact.py create "${{ github.sha }}"
      - run: google-chrome --version
      - run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      - name: Authenticate disposable Redis
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET requirepass ci-only-redis; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Full product browser, concurrency and dump restore
        run: python .github/scripts/run_backend.py browser
      - run: python .github/scripts/frontend_artifact.py verify "${{ github.sha }}"
      - name: Retain full browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-browser-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/browser.xml
            .local/*.png
            .local/w11-*.json
            .local/database-version.json
          retention-days: 7
